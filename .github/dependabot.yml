# Keeps GitHub Actions and Go dependencies current. SECURITY.md advertises
# automated dependency updates — this config is what delivers them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # develop is the integration branch; without this dependabot targets the default
    # branch (main) and every bump leaves develop behind.
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    # develop is the integration branch; without this dependabot targets the default
    # branch (main) and every bump leaves develop behind.
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]
