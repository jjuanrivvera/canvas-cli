name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'commands/**'
      - 'tools/gendocs/**'
      - 'CHANGELOG.md'
  workflow_dispatch:

# mkdocs gh-deploy pushes the gh-pages branch, so contents: write stays on the
# job. Top-level stays read-only; a new job must opt into any write it needs.
permissions:
  contents: read

env:
  GOOGLE_ANALYTICS_KEY: ${{ vars.GOOGLE_ANALYTICS_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Generate CLI Reference
        run: go run ./tools/gendocs/main.go

      # docs/changelog.md is a copy of the root CHANGELOG.md (source of truth)
      - name: Sync changelog
        run: cp CHANGELOG.md docs/changelog.md

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install MkDocs
        run: |
          pip install mkdocs-material
          pip install mkdocs-git-revision-date-localized-plugin

      - name: Build Documentation
        run: mkdocs build --strict

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
