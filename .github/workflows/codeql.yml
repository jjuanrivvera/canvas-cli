# CodeQL for the Go module. Scorecard's SAST check looks for github/codeql-action
# in a workflow; gosec still runs inside the fleet CI workflow and stays the
# blocking gate. This job publishes results to code scanning. A finding does not
# fail the run — only an analysis error does.
name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    # Weekly, off the hour, so it does not land on the same minute as every other repo.
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # Job permissions replace the workflow set, so restate the reads this job needs.
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Autobuild runs inside init, so the toolchain from go.mod has to be on PATH first.
      # The runner image's Go is often older than the directive, and CodeQL's build
      # does not reliably download a newer toolchain on its own.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
