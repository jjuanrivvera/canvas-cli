# Release — delegates to the fleet-canonical reusable release workflow in jjuanrivvera/.github.
# Change release-pipeline policy there, not here. The .goreleaser.yaml config stays per-repo.
#
# go-release.yml stays on @main on purpose (same reason as go-ci.yml): cosign,
# syft, and GoReleaser live in the fleet workflow, and a SHA pin here would
# freeze that pipeline. Caller job permissions are the ceiling the called
# workflow is allowed to use — they must cover what go-release.yml requests
# (GitHub release, GHCR, cosign OIDC, and the promote-main fast-forward).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: jjuanrivvera/.github/.github/workflows/go-release.yml@main
    secrets: inherit
    with:
      # This repo is git-flow: releases are tagged on develop, so without this
      # main never advances past the release before it. v1.15.0 was cut on
      # develop and main stayed on v1.14.0, which is what froze its badges.
      promote-main: true
