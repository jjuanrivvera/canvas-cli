# CI — delegates to the fleet-canonical reusable workflow in jjuanrivvera/.github.
# Change fleet-wide CI policy there, not here. Repo-specific inputs and the binary
# integration job (not part of the shared surface) live below.
# claude.yml (the @claude mention workflow) stays separate. PR review is CodeRabbit.
#
# go-ci.yml stays on @main on purpose. It is this org's fleet workflow, not a
# third-party action: pinning it would freeze lint, govulncheck, and gosec until
# a manual bump. Dependabot does not open PRs for a floating branch ref.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: jjuanrivvera/.github/.github/workflows/go-ci.yml@main
    with:
      coverage-threshold: "80"
      run-gosec: true
      run-docs-check: false

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run integration tests
        env:
          CANVAS_CLI_MACHINE_ID: test-machine-id-ci
        run: go test -tags integration -v -timeout 5m ./test/integration/
