name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  GOTOOLCHAIN: local

jobs:
  # Linting jobs
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          fmt_output=$(gofmt -l .)
          if [ -n "$fmt_output" ]; then
            echo "Files not formatted:"
            echo "$fmt_output"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        # Install from source with the repo's Go toolchain. Prebuilt release
        # binaries are built with an older Go and refuse to run against a newer
        # go.mod target; this also pins the v2 line that matches .golangci.yml.
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
          golangci-lint run

  # Security scanning
  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Blocking: vulnerabilities reachable from our code must be fixed (bump
      # the dependency, or the toolchain directive in go.mod for stdlib fixes)
      # before merging.
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          govulncheck ./...

      # All gosec findings have been resolved (G104 via mustMarkRequired helper
      # and #nosec annotations with justifications; remaining rules fixed or
      # annotated). gosec now enforces a zero-finding gate on every PR.
      - name: Run Gosec
        uses: securego/gosec@v2.27.1
        with:
          args: '-fmt text ./...'

  # Test matrix
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.mod', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        shell: bash
        env:
          CANVAS_CLI_MACHINE_ID: test-machine-id-${{ github.run_id }}
        # -timeout 20m: the commands package has a large test suite and the
        # race detector is ~3x slower on the Windows runner, exceeding the 10m
        # default there.
        run: go test -v -race -timeout 20m -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage gate (>= 80%)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          echo "Total coverage: ${total}%"
          awk -v c="$total" 'BEGIN { if (c+0 < 80.0) { print "FAIL: total coverage below 80%"; exit 1 } }'

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: jjuanrivvera/canvas-cli
          files: ./coverage.out
          fail_ci_if_error: false

      - name: Build
        shell: bash
        run: go build -v ./cmd/canvas

  # Binary-level integration tests (compiled binary + mock Canvas server)
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run integration tests
        env:
          CANVAS_CLI_MACHINE_ID: test-machine-id-ci
        run: go test -tags integration -v -timeout 5m ./test/integration/

  # Build artifacts
  build:
    name: Build Release
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Snapshot build through GoReleaser so CI artifacts are produced by the
      # same pipeline (ldflags, archives, checksums, docker image) as tagged
      # releases. Signing and SBOMs are skipped: cosign and syft are only
      # installed in the release workflow, which runs the full pipeline.
      - name: Build snapshot for all platforms
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean --skip=sign,sbom

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist/
          retention-days: 7
