version: "2"
run:
  modules-download-mode: readonly
  tests: true
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
  settings:
    staticcheck:
      # QF* are optional "quickfix" refactoring hints that became default when v2
      # merged gosimple/stylecheck into staticcheck. The v1 setup never enforced
      # them, so keep them off to preserve the established lint contract.
      checks:
        - all
        - -QF1003
        - -QF1008
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*github.com/spf13/cobra.Command).MarkFlagRequired
        - github.com/spf13/viper.BindPFlag
        - (*net/http.Server).Shutdown
        - fmt.Scanln
        - fmt.Sscanf
        - fmt.Println
        - fmt.Printf
        - fmt.Fprintln
        - fmt.Fprintf
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/jjuanrivvera/canvas-cli
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
