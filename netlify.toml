[build]
  base = "landing"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  SITE_URL = "https://canvas-cli.jjuanrivvera.com/"

[context.deploy-preview.environment]
  SITE_URL = ""

[context.branch-deploy.environment]
  SITE_URL = ""

[[redirects]]
  from = "https://canvas-cli-jjuanrivvera.netlify.app/*"
  to = "https://canvas-cli.jjuanrivvera.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'"
    Cache-Control = "public, max-age=0, must-revalidate"
